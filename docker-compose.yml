services:
  # Browser UI — docker compose up web, then open the ?token= URL it prints
  web:
    build: .
    entrypoint: ["tradingagents-web", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    ports:
      # Loopback only: the UI can store keys and place orders. To expose it on
      # a LAN, set TRADINGAGENTS_WEB_TOKEN in .env and widen this mapping.
      - "127.0.0.1:8000:8000"
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents

  tradingagents:
    build: .
    entrypoint: ["tradingagents"]
    env_file:
      - .env
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    tty: true
    stdin_open: true

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  tradingagents-ollama:
    build: .
    entrypoint: ["tradingagents"]
    env_file:
      - .env
    environment:
      - TRADINGAGENTS_LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434/v1
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    depends_on:
      - ollama
    tty: true
    stdin_open: true
    profiles:
      - ollama

volumes:
  tradingagents_data:
  ollama_data:
